name: D Hosting Linux Runtime Checks

on:
  pull_request:
    paths:
      - "apps/d-hosting/**"
      - "apps/d-hosting-agent/**"
      - "apps/d-database/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/d-hosting-runtime-linux.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/d-hosting/**"
      - "apps/d-hosting-agent/**"
      - "apps/d-database/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/d-hosting-runtime-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-hosting-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Hosting and runtime-agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NAME: dsquare_ci_placeholder
      DB_USER: dsquare_ci_placeholder
      DB_PASSWORD_BASE64: dGVzdA==
      HOSTING_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize workspace lockfile in the CI checkout
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies without running package lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Type-check D Database API
        run: npm run typecheck --workspace=@dsquare/d-database-server

      - name: Test D Database API
        run: npm test --workspace=@dsquare/d-database-server

      - name: Type-check D Database dashboard
        run: npm run typecheck --workspace=@dsquare/d-database-client

      - name: Test D Database dashboard product configuration
        run: npm test --workspace=@dsquare/d-database-client

      - name: Build D Database dashboard
        run: npm run build --workspace=@dsquare/d-database-client

      - name: Type-check D Hosting API
        run: npm run typecheck --workspace=@dsquare/d-hosting-server

      - name: Test D Hosting API
        run: npm test --workspace=@dsquare/d-hosting-server

      - name: Type-check D Hosting dashboard
        run: npm run typecheck --workspace=@dsquare/d-hosting-client

      - name: Build D Hosting dashboard
        run: npm run build --workspace=@dsquare/d-hosting-client

      - name: Type-check runtime agent
        run: npm run typecheck --workspace=@dsquare/d-hosting-agent-server

      - name: Test runtime agent
        run: npm test --workspace=@dsquare/d-hosting-agent-server


  platform-backup-restore-integration:
    name: Real platform backup worker restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dsquare_ci
          POSTGRES_PASSWORD: dsquare_ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dsquare_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: dsquare_ci
      PGPASSWORD: dsquare_ci_test_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize workspace lockfile in the CI checkout
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install PostgreSQL client tools and validate recovery scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          bash -n apps/d-hosting/server/scripts/restore-platform-backup.sh
          bash -n apps/d-database/server/scripts/restore-platform-backup.sh

      - name: Run both actual platform backup workers and restore their archives
        shell: bash
        run: |
          set -euo pipefail
          createdb dsquare_backup_source
          createdb --template=template0 dsquare_restore_hosting_ci
          createdb --template=template0 dsquare_restore_database_ci
          npx tsx scripts/platform-backup-worker-integration.ts

      - name: Verify corrupt archive cannot partially modify an isolated target
        shell: bash
        run: |
          set -euo pipefail
          createdb dsquare_backup_guard
          pg_dump --format=custom --no-owner --no-acl --dbname=dsquare_backup_source --file=/tmp/dsquare-platform.dump
          psql -v ON_ERROR_STOP=1 -d dsquare_backup_guard -c "CREATE TABLE restore_guard (id integer PRIMARY KEY); INSERT INTO restore_guard VALUES (77);"
          cp /tmp/dsquare-platform.dump /tmp/dsquare-platform-corrupt.dump
          truncate -s 64 /tmp/dsquare-platform-corrupt.dump
          if pg_restore --single-transaction --exit-on-error --no-owner --no-acl --dbname=dsquare_backup_guard /tmp/dsquare-platform-corrupt.dump; then
            echo "Corrupted archive unexpectedly restored successfully."
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -d dsquare_backup_guard -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM restore_guard WHERE id = 77) THEN RAISE EXCEPTION 'Failed restore changed existing target data'; END IF; END \$\$;"
          echo "Corrupt archive was rejected and the isolated target remained unchanged."

  podman-linux-smoke:
    name: Rootless Podman Linux smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Verify rootless Podman host and cgroup support
        run: |
          podman --version
          podman info --format '{{.Host.CgroupsVersion}}'
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Pull the approved Node.js 22 CI image
        run: podman pull docker.io/library/node:22-bookworm-slim

      - name: Run a restricted Node.js 22 container as the runner user
        run: |
          podman run --rm --pull=never \
            --network=none \
            --user 10001:10001 \
            --read-only \
            --cap-drop=all \
            --security-opt=no-new-privileges \
            --pids-limit=64 \
            --memory=256m \
            --cpus=0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            docker.io/library/node:22-bookworm-slim \
            node -e "if (process.version.split('.')[0] !== 'v22') process.exit(1); console.log('Restricted Node runtime OK:', process.version)"

      - name: Verify isolated persistent bind mounts survive runtime replacement
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'podman rm --force --time 1 dsquare-persistent-a dsquare-persistent-b >/dev/null 2>&1 || true; podman unshare rm -rf "$root" 2>/dev/null || rm -rf "$root"' EXIT
          mkdir -p "$root/site-a" "$root/site-b"
          podman run --detach --name dsquare-persistent-a --pull=never \
            --network=none --user 10001:10001 --read-only --cap-drop=all --stop-timeout=1 \
            --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=0.5 \
            --volume "$root/site-a:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "require('http').createServer((_,res)=>res.end('ready')).listen(3000,'0.0.0.0')"
          podman exec dsquare-persistent-a node -e "require('fs').writeFileSync('/var/lib/dsquare/persist.txt','kept')"
          podman rm --force --time 1 dsquare-persistent-a
          podman run --detach --name dsquare-persistent-b --pull=never \
            --network=none --user 10001:10001 --read-only --cap-drop=all --stop-timeout=1 \
            --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=0.5 \
            --volume "$root/site-a:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "require('http').createServer((_,res)=>res.end('ready')).listen(3000,'0.0.0.0')"
          podman exec dsquare-persistent-b node -e "if(require('fs').readFileSync('/var/lib/dsquare/persist.txt','utf8')!=='kept')process.exit(1)"
          podman rm --force --time 1 dsquare-persistent-b
          podman run --rm --pull=never --network=none --user 10001:10001 \
            --volume "$root/site-b:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "if(require('fs').existsSync('/var/lib/dsquare/persist.txt'))process.exit(1)"
          echo "Persistent data survived container replacement and remained isolated."
