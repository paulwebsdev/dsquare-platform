name: D Hosting Linux Runtime Checks

on:
  pull_request:
    paths:
      - "apps/d-hosting/**"
      - "apps/d-hosting-agent/**"
      - "apps/d-database/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/d-hosting-runtime-linux.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "apps/d-hosting/**"
      - "apps/d-hosting-agent/**"
      - "apps/d-database/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/d-hosting-runtime-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-hosting-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Hosting and runtime-agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NAME: dsquare_ci_placeholder
      DB_USER: dsquare_ci_placeholder
      DB_PASSWORD_BASE64: dGVzdA==
      HOSTING_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize workspace lockfile in the CI checkout
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies without running package lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Type-check D Database API
        run: npm run typecheck --workspace=@dsquare/d-database-server

      - name: Test D Database API
        run: npm test --workspace=@dsquare/d-database-server

      - name: Type-check D Database SDK
        run: npm run typecheck --workspace=@dsquare/d-database

      - name: Test D Database SDK
        run: npm test --workspace=@dsquare/d-database

      - name: Type-check D Hosting API
        run: npm run typecheck --workspace=@dsquare/d-hosting-server

      - name: Test D Hosting API
        run: npm test --workspace=@dsquare/d-hosting-server

      - name: Type-check runtime agent
        run: npm run typecheck --workspace=@dsquare/d-hosting-agent-server

      - name: Test runtime agent
        run: npm test --workspace=@dsquare/d-hosting-agent-server

  podman-linux-smoke:
    name: Rootless Podman Linux smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Verify rootless Podman host and cgroup support
        run: |
          podman --version
          podman info --format '{{.Host.CgroupsVersion}}'
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Pull the approved Node.js 22 CI image
        run: podman pull docker.io/library/node:22-bookworm-slim

      - name: Run a restricted Node.js 22 container as the runner user
        run: |
          podman run --rm --pull=never \
            --network=none \
            --user 10001:10001 \
            --read-only \
            --cap-drop=all \
            --security-opt=no-new-privileges \
            --pids-limit=64 \
            --memory=256m \
            --cpus=0.5 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            docker.io/library/node:22-bookworm-slim \
            node -e "if (process.version.split('.')[0] !== 'v22') process.exit(1); console.log('Restricted Node runtime OK:', process.version)"

      - name: Verify isolated persistent bind mounts survive runtime replacement
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'podman rm --force --time 1 dsquare-persistent-a dsquare-persistent-b >/dev/null 2>&1 || true; podman unshare rm -rf "$root" 2>/dev/null || rm -rf "$root"' EXIT
          mkdir -p "$root/site-a" "$root/site-b"
          podman run --detach --name dsquare-persistent-a --pull=never \
            --network=none --user 10001:10001 --read-only --cap-drop=all --stop-timeout=1 \
            --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=0.5 \
            --volume "$root/site-a:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "require('http').createServer((_,res)=>res.end('ready')).listen(3000,'0.0.0.0')"
          podman exec dsquare-persistent-a node -e "require('fs').writeFileSync('/var/lib/dsquare/persist.txt','kept')"
          podman rm --force --time 1 dsquare-persistent-a
          podman run --detach --name dsquare-persistent-b --pull=never \
            --network=none --user 10001:10001 --read-only --cap-drop=all --stop-timeout=1 \
            --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=0.5 \
            --volume "$root/site-a:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "require('http').createServer((_,res)=>res.end('ready')).listen(3000,'0.0.0.0')"
          podman exec dsquare-persistent-b node -e "if(require('fs').readFileSync('/var/lib/dsquare/persist.txt','utf8')!=='kept')process.exit(1)"
          podman rm --force --time 1 dsquare-persistent-b
          podman run --rm --pull=never --network=none --user 10001:10001 \
            --volume "$root/site-b:/var/lib/dsquare:rw,U,Z" \
            docker.io/library/node:22-bookworm-slim \
            node -e "if(require('fs').existsSync('/var/lib/dsquare/persist.txt'))process.exit(1)"
          echo "Persistent data survived container replacement and remained isolated."
